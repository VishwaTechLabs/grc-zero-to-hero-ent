name: Curriculum Freshness Marker
on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 1 * *"
permissions:
  contents: write
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write timestamp
        run: |
          mkdir -p data
          printf '# 📅 Last Automated Review\n\nTimestamp: %s UTC\n\nThis is a repository freshness marker, not legal or compliance certification.\n' "$(date -u '+%Y-%m-%d %H:%M')" > data/LAST_REVIEW.md
      - name: Commit marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/LAST_REVIEW.md
          git diff --cached --quiet || git commit -m "docs: update freshness marker"
          git push || true
